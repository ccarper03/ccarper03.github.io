<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>This tool moved</title>
<style>
  :root { --bg: #f6f5f2; --ink: #1d2126; --muted: #5d6470; --card: #ffffff; --line: #e2e0da; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181b; --ink: #ecebe7; --muted: #a3a8b0; --card: #1f2226; --line: #33373d; } }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
         font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main class="card">
  <h1>This tool moved.</h1>
  <p>Ask Charles for the new link.</p>
</main>
<script>
  // Retire this tool's old offline copy on this device. Only this tool's own files; other tools on this site keep theirs.
  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (/\/DRH-Inventory-Dashboard\/$/.test(r.scope)) r.unregister(); }); }).catch(function () {});
    if ('caches' in window) caches.keys().then(function (ks) { ks.forEach(function (k) { if (/^drh-inv-/.test(k)) caches.delete(k); }); }).catch(function () {});
  } catch (e) {}
</script>
</body>
</html>
